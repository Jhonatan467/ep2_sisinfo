<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LabBlog{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
    <a class="navbar-brand" href="{% url 'post-list' %}">LabBlog</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'post-list' %}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'category-list' %}">Categorias</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'post-create' %}">Novo post</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="container mt-5 mb-3 text-center text-muted">
    <small>&copy; {% now "Y" %} LabBlog</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
