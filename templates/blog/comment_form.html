{% extends "base.html" %}
{% block title %}Novo comentário | LabBlog{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Novo comentário em "{{ post.title }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
        <label class="form-label" for="id_text">{{ form.text.label }}</label>
        {{ form.text }}
        {{ form.text.errors }}
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Enviar comentário</button>
        <a class="btn btn-outline-secondary" href="{% url 'post-detail' post.pk %}">Cancelar</a>
    </div>
</form>
{% endblock %}
