{% extends "base.html" %}
{% block title %}Remover post | LabBlog{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Tem certeza que deseja remover "{{ post.title }}"?</h1>
<p class="mb-3">Esta ação não poderá ser desfeita.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Confirmar remoção</button>
    <a class="btn btn-outline-secondary" href="{% url 'post-detail' post.pk %}">Cancelar</a>
</form>
{% endblock %}
